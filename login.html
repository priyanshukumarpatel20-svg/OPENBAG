<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | OPEN द BAG</title>
  <meta name="description" content="Sign in to OPEN द BAG">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="auth-split">
    <div class="auth-illustration" aria-hidden="true">
      <img class="illo-bag" src="images/placeholder.svg" alt="">
    </div>

    <div class="auth-panel">
      <a class="logo auth-logo" href="index.html"><img src="images/logo.png" alt="OPEN द BAG"></a>

      <div class="auth-choice">
        <h1>Welcome to OPEN द BAG</h1>
        <p>Choose how you'd like to sign in.</p>
        <a class="choice-button" data-role="customer" href="customer.html">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
          Customer Login
        </a>
        <a class="choice-button" data-role="owner" href="owner.html">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 5 6v5c0 5 3 8.5 7 10 4-1.5 7-5 7-10V6l-7-3Z"/></svg>
          Owner Login
        </a>
      </div>

      <div class="signed-in" hidden>
        <h1>You're signed in</h1>
        <p class="signed-in-email"></p>
        <button class="button" type="button">Sign out</button>
      </div>
    </div>
  </main>

  <script type="module">
    import { app } from "./firebase-config.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    const auth = getAuth(app);
    const choice = document.querySelector(".auth-choice");
    const signedIn = document.querySelector(".signed-in");

    document.querySelector(".signed-in button").addEventListener("click", () => signOut(auth));

    onAuthStateChanged(auth, (user) => {
      choice.hidden = Boolean(user);
      signedIn.hidden = !user;
      if (user) document.querySelector(".signed-in-email").textContent = user.email || "your account";
    });
  </script>
</body>
</html>
