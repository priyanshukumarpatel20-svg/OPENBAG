<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Owner Dashboard | OPEN द BAG</title>
  <meta name="description" content="Add and manage products.">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="container">
      <a class="logo" href="index.html"><img src="images/logo.png" alt="OPEN द BAG"></a>
      <nav class="nav">
        <a href="index.html">View store</a>
      </nav>
      <div class="header-actions">
        <button type="button" id="sign-out" aria-label="Sign out">
          <svg class="icon" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="container dashboard" hidden>
    <div class="section-head">
      <h2>Owner dashboard</h2>
      <span class="role-badge">Signed in as <span class="owner-email"></span></span>
    </div>

    <section class="auth-card dashboard-card">
      <h1>Add a product</h1>
      <p>Appears on the homepage right after you add it.</p>

      <form class="product-form">
        <label class="field"><input type="text" name="name" placeholder="Product name" required></label>
        <label class="field"><input type="number" name="mrp" placeholder="MRP (₹)" min="1" required></label>
        <label class="field"><input type="number" name="price" placeholder="Selling price (₹)" min="1" required></label>
        <label class="field"><input type="number" name="rating" placeholder="Rating (optional, e.g. 4.8)" min="1" max="5" step="0.1"></label>
        <label class="field file-field">
          <input type="file" name="image" accept="image/*" required>
          <span class="file-field-label">Choose product photo</span>
        </label>
        <img class="image-preview" hidden alt="Preview">
        <button class="button" type="submit">Add product</button>
      </form>

      <p class="product-message auth-message" role="alert"></p>
    </section>

    <section class="dashboard-list">
      <div class="section-head">
        <h2>Your products</h2>
      </div>
      <div class="product-grid owner-product-grid"></div>
      <p class="empty-message" hidden>No products added yet.</p>
    </section>
  </main>

  <script type="module">
    import { app, db, friendlyAuthError } from "./firebase-config.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
    import {
      doc, getDoc, collection, addDoc, deleteDoc, getDocs, query, orderBy, serverTimestamp,
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

    const auth = getAuth(app);
    const main = document.querySelector(".dashboard");
    const emailLabel = document.querySelector(".owner-email");
    const grid = document.querySelector(".owner-product-grid");
    const emptyMessage = document.querySelector(".empty-message");

    // --- Route guard: only a signed-in owner gets past this ---
    onAuthStateChanged(auth, async (user) => {
      if (!user) { location.href = "login.html"; return; }
      const snap = await getDoc(doc(db, "users", user.uid));
      if (!snap.exists() || snap.data().role !== "owner") { location.href = "index.html"; return; }
      emailLabel.textContent = user.email;
      main.hidden = false;
      loadProducts();
    });

    document.getElementById("sign-out").addEventListener("click", () => signOut(auth).then(() => location.href = "login.html"));

    // --- Image: shrink to a reasonable size and encode as base64, so no Storage billing is needed ---
    function fileToCompressedBase64(file, maxWidth = 800, quality = 0.72) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(reader.error);
        reader.onload = () => {
          const img = new Image();
          img.onerror = reject;
          img.onload = () => {
            const scale = Math.min(1, maxWidth / img.width);
            const canvas = document.createElement("canvas");
            canvas.width = img.width * scale;
            canvas.height = img.height * scale;
            canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL("image/jpeg", quality));
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    const form = document.querySelector(".product-form");
    const message = document.querySelector(".product-message");
    const imageInput = form.elements.image;
    const preview = document.querySelector(".image-preview");
    const fileLabel = document.querySelector(".file-field-label");

    imageInput.addEventListener("change", () => {
      const file = imageInput.files[0];
      fileLabel.textContent = file ? file.name : "Choose product photo";
      if (!file) { preview.hidden = true; return; }
      fileToCompressedBase64(file).then((dataUrl) => {
        preview.src = dataUrl;
        preview.hidden = false;
      });
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.textContent = "";
      const { name, mrp, price, rating, image } = form.elements;
      if (!image.files[0]) { message.textContent = "Choose a product photo."; return; }

      const submit = form.querySelector("button[type=submit]");
      submit.disabled = true;
      submit.textContent = "Adding…";
      try {
        const imageData = await fileToCompressedBase64(image.files[0]);
        await addDoc(collection(db, "products"), {
          name: name.value,
          mrp: Number(mrp.value),
          price: Number(price.value),
          rating: rating.value || null,
          image: imageData,
          createdAt: serverTimestamp(),
        });
        form.reset();
        preview.hidden = true;
        fileLabel.textContent = "Choose product photo";
        loadProducts();
      } catch (error) {
        message.textContent = friendlyAuthError(error);
      } finally {
        submit.disabled = false;
        submit.textContent = "Add product";
      }
    });

    // --- List + delete ---
    async function loadProducts() {
      grid.innerHTML = "";
      const snapshot = await getDocs(query(collection(db, "products"), orderBy("createdAt", "desc")));
      emptyMessage.hidden = !snapshot.empty;
      snapshot.forEach((docSnap) => {
        const { name, price, image } = docSnap.data();
        const card = document.createElement("article");
        card.className = "product-card";
        card.innerHTML = `
          <div class="image-tile">
            <img src="${image || "images/placeholder.svg"}" alt="${name}">
            <button class="add-button delete-button" type="button" aria-label="Delete ${name}">&times;</button>
          </div>
          <h3>${name}</h3>
          <p class="product-meta"><span class="price-tag">₹${Number(price).toLocaleString("en-IN")}</span></p>`;
        card.querySelector(".delete-button").addEventListener("click", async () => {
          if (!confirm(`Delete "${name}"?`)) return;
          await deleteDoc(doc(db, "products", docSnap.id));
          loadProducts();
        });
        grid.appendChild(card);
      });
    }
  </script>
</body>
</html>
